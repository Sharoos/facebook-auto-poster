name: Auto Post to Facebook & Instagram

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-poster:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants git push permissions to GITHUB_TOKEN
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Poster Script
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python poster.py

      - name: Commit Updated Posted History Log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted_products.json
          git commit -m "Update posted history [skip ci]" || exit 0
          git push
